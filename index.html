<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baby Food Portal</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Baby Food">
    
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22white%22/><text x=%2250%22 y=%2250%22 font-size=%2270%22 text-anchor=%22middle%22 dy=%22.35em%22>🍼</text></svg>">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍼</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // ====================================================================
        // PARENT PORTAL (v23 - Fixed Form Values)
        // ====================================================================

        // PLACEHOLDERS - Replace if using manually, otherwise handled by GitHub Actions
        const FORM_ACTION_URL = "__FORM_ACTION_URL__";
        const SHEET_ID = "__SHEET_ID__";
        
        const SHEET_VISUAL_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:html&tq=SELECT+A,B,C,D,E,F,G+ORDER+BY+A+DESC`;
        const SHEET_DATA_QUERY = `SELECT A, B, F, G`; 
        const SHEET_API_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:handleRemoteData&tq=${encodeURIComponent(SHEET_DATA_QUERY)}`;

        const MAPPING = {
            food: "entry.1040270621",
            amount: "entry.405830364",
            unit: "entry.1638831485",
            enjoyment: "entry.1622795550",
            date: "entry.101085612",
            time: "entry.942646777"
        };

        const LOCAL_HISTORY_KEY = "baby_food_history_master";
        const CONFIG_KEY = "baby_food_config_v1";
        const DEFAULT_CONFIG = { suggestionCount: 5 };

        let globalFoodHistory = []; 
        let remoteFetchComplete = false;
        let tempHour = "12";
        let tempMinute = "00";
        let currentUnitMode = "score"; // 'score', 'g', or 'other'

        window.onload = function() {
            setupSmartDefaults();
            attemptHybridLoad();
            
            document.getElementById('inputFood').addEventListener('input', function(e) {
                this.value = this.value.toLowerCase();
                renderSuggestions(this.value);
            });
        };

        // --- Unit Toggle Logic ---

        function setUnitMode(mode) {
            currentUnitMode = mode;
            
            // Update Buttons UI
            const btns = {
                'score': document.getElementById('btn-mode-score'),
                'g': document.getElementById('btn-mode-g'),
                'other': document.getElementById('btn-mode-other')
            };

            // Reset all
            Object.values(btns).forEach(btn => {
                btn.className = "flex-1 py-3 rounded-lg text-sm font-medium text-gray-500 hover:bg-white hover:shadow-sm transition";
            });

            // Activate selected
            if(btns[mode]) {
                btns[mode].className = "flex-1 py-3 rounded-lg text-sm font-bold shadow bg-white text-indigo-600 transition transform scale-105";
            }

            // Show/Hide Dropdown for "Other"
            const otherContainer = document.getElementById('otherUnitContainer');
            if (mode === 'other') {
                otherContainer.classList.remove('hidden');
            } else {
                otherContainer.classList.add('hidden');
            }

            renderAmountInput();
        }

        function renderAmountInput() {
            const container = document.getElementById('amountContainer');
            
            if (currentUnitMode === 'score') {
                // Show 0-5 Buttons
                container.innerHTML = `
                    <div class="flex justify-between gap-1">
                        ${[0,1,2,3,4,5].map(num => `
                            <label class="flex-1">
                                <input type="radio" name="amountScore" value="${num}" class="sr-only peer" ${num===3 ? 'checked' : ''}>
                                <div class="text-center py-3 bg-white border border-gray-200 rounded-lg peer-checked:bg-blue-100 peer-checked:border-blue-500 peer-checked:text-blue-700 cursor-pointer transition font-bold">${num}</div>
                            </label>
                        `).join('')}
                    </div>`;
            } else {
                // Show Number Input (for Grams or Other)
                const placeholder = currentUnitMode === 'g' ? "e.g. 50" : "e.g. 1/2";
                container.innerHTML = `<input type="number" inputmode="decimal" id="inputAmountText" placeholder="${placeholder}" class="w-full p-3 border border-gray-300 rounded-lg text-lg focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none">`;
            }
        }

        // --- Fixed Time Picker ---

        function openTimeModal() {
            const current = document.getElementById('timeDisplay').innerText.split(':');
            if (current.length === 2) {
                tempHour = current[0];
                tempMinute = current[1];
            }
            renderTimePicker();
            
            document.getElementById('timeModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            
            setTimeout(() => {
                const hEl = document.getElementById(`h-${tempHour}`);
                const mEl = document.getElementById(`m-${tempMinute}`);
                if(hEl) hEl.scrollIntoView({block: "center"});
                if(mEl) mEl.scrollIntoView({block: "center"});
            }, 100);
        }

        function closeTimeModal() {
            document.getElementById('timeModal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        function saveTimeModal() {
            document.getElementById('timeDisplay').innerText = `${tempHour}:${tempMinute}`;
            closeTimeModal();
        }

        function setTempTime(type, val) {
            if (type === 'hour') tempHour = val;
            if (type === 'minute') tempMinute = val;
            renderTimePicker();
        }

        function renderTimePicker() {
            const hoursContainer = document.getElementById('pickerHours');
            const minsContainer = document.getElementById('pickerMinutes');

            let hHtml = '';
            for(let i=0; i<24; i++) {
                const val = String(i).padStart(2, '0');
                const isSelected = val === tempHour;
                hHtml += `<div id="h-${val}" onclick="setTempTime('hour', '${val}')" 
                    class="p-4 text-center cursor-pointer font-bold text-xl ${isSelected ? 'bg-indigo-100 text-indigo-700' : 'text-gray-500 hover:bg-gray-50'}">
                    ${val}
                </div>`;
            }
            hoursContainer.innerHTML = hHtml;

            let mHtml = '';
            for(let i=0; i<60; i+=10) {
                const val = String(i).padStart(2, '0');
                const isSelected = val === tempMinute;
                mHtml += `<div id="m-${val}" onclick="setTempTime('minute', '${val}')" 
                    class="p-4 text-center cursor-pointer font-bold text-xl ${isSelected ? 'bg-indigo-100 text-indigo-700' : 'text-gray-500 hover:bg-gray-50'}">
                    ${val}
                </div>`;
            }
            minsContainer.innerHTML = mHtml;
        }

        // --- Config & Data ---
        function getConfig() { return JSON.parse(localStorage.getItem(CONFIG_KEY) || JSON.stringify(DEFAULT_CONFIG)); }
        function saveConfig(newConfig) {
            localStorage.setItem(CONFIG_KEY, JSON.stringify(newConfig));
            renderSuggestions(document.getElementById('inputFood').value);
        }
        function updateSuggestionSetting(val) {
            const count = parseInt(val);
            if(count > 0) {
                const config = getConfig();
                config.suggestionCount = count;
                saveConfig(config);
            }
        }

        function attemptHybridLoad() {
            loadFromLocal();
            renderSuggestions(); 
            updateStatus("checking");
            const script = document.createElement('script');
            script.src = SHEET_API_URL;
            script.onerror = () => { updateStatus("offline"); remoteFetchComplete = true; };
            document.body.appendChild(script);
            setTimeout(() => { if (!remoteFetchComplete) updateStatus("offline"); }, 3000);
        }

        window.handleRemoteData = function(response) {
            remoteFetchComplete = true;
            if (response.status === 'error') { updateStatus("offline"); return; }
            updateStatus("online");
            const rows = response.table.rows;
            const historyMap = {};
            rows.forEach(row => {
                const cellFood = row.c[1];
                if (!cellFood || !cellFood.v) return;
                const foodName = String(cellFood.v).toLowerCase().trim();
                let recordDate = null;
                try {
                    const cellDate = row.c[2]; 
                    const cellTime = row.c[3]; 
                    if (cellDate && (cellDate.f || cellDate.v)) {
                        const dStr = cellDate.f || cellDate.v;
                        const tStr = (cellTime && cellTime.f) ? cellTime.f : "00:00";
                        if (typeof dStr === 'string' && dStr.startsWith('Date(')) {
                             const parts = dStr.match(/\d+/g);
                             if(parts && parts.length >= 3) {
                                 recordDate = new Date(parts[0], parts[1], parts[2]); 
                                 if(tStr) {
                                     const tParts = tStr.split(':');
                                     if(tParts.length >= 2) recordDate.setHours(tParts[0], tParts[1]);
                                 }
                             }
                        } else { recordDate = new Date(`${dStr}T${tStr}`); }
                    } else if (row.c[0] && row.c[0].v) {
                        const val = row.c[0].v;
                        if (typeof val === 'string' && val.startsWith('Date(')) {
                             const parts = val.match(/\d+/g);
                             if (parts && parts.length >= 3) recordDate = new Date(parts[0], parts[1], parts[2], parts[3]||0, parts[4]||0, parts[5]||0);
                        } else { recordDate = new Date(val); }
                    }
                } catch(e) {}
                if (recordDate && !isNaN(recordDate.getTime())) {
                    if (!historyMap[foodName] || recordDate > historyMap[foodName]) historyMap[foodName] = recordDate.toISOString();
                }
            });
            updateLocalFromMap(historyMap);
        };

        function getLocalMap() { return JSON.parse(localStorage.getItem(LOCAL_HISTORY_KEY) || '{}'); }
        function loadFromLocal() {
            const historyMap = getLocalMap();
            globalFoodHistory = Object.keys(historyMap).map(key => ({ name: key, lastEaten: new Date(historyMap[key]) }));
            globalFoodHistory.sort((a, b) => a.lastEaten - b.lastEaten);
        }
        function saveToLocal(foodName) {
            const map = getLocalMap();
            map[foodName.toLowerCase()] = new Date().toISOString();
            localStorage.setItem(LOCAL_HISTORY_KEY, JSON.stringify(map));
            loadFromLocal();
        }
        function updateLocalFromMap(newMap) {
            const localMap = getLocalMap();
            Object.keys(newMap).forEach(key => {
                const remoteDate = new Date(newMap[key]);
                const localDate = localMap[key] ? new Date(localMap[key]) : null;
                if (!localDate || remoteDate > localDate) localMap[key] = newMap[key];
            });
            localStorage.setItem(LOCAL_HISTORY_KEY, JSON.stringify(localMap));
            loadFromLocal();
            renderSuggestions(document.getElementById('inputFood').value);
        }

        // --- UI Actions ---
        function openSettingsModal() {
            const config = getConfig();
            document.getElementById('settingSuggestionCount').value = config.suggestionCount;
            document.getElementById('settingsModal').classList.remove('hidden');
        }
        function closeSettingsModal() { document.getElementById('settingsModal').classList.add('hidden'); }
        
        function runImport() {
            const text = document.getElementById('importText').value;
            if(!text) return;
            const lines = text.split(/\n|,/);
            const map = {};
            const now = new Date().toISOString();
            lines.forEach(line => {
                const food = line.trim().toLowerCase();
                if(food && food.length > 1) map[food] = now;
            });
            updateLocalFromMap(map);
            alert(`Imported ${Object.keys(map).length} items!`);
        }
        function openGoogleSheet() { window.open(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`, '_blank'); }
        function resetCache() {
            if(confirm("Reset local cache?")) { localStorage.removeItem(LOCAL_HISTORY_KEY); location.reload(); }
        }
        function updateStatus(state) {
            const dot = document.getElementById('statusDot');
            const label = document.getElementById('statusLabel');
            if (state === "checking") { dot.className = "w-2 h-2 rounded-full bg-yellow-400 animate-pulse"; label.textContent = "Syncing"; } 
            else if (state === "online") { dot.className = "w-2 h-2 rounded-full bg-green-500"; label.textContent = "Synced"; } 
            else { dot.className = "w-2 h-2 rounded-full bg-red-500"; label.textContent = "Offline"; }
        }

        function renderSuggestions(filterText = "") {
            const container = document.getElementById('suggestionChips');
            const config = getConfig();
            const limit = config.suggestionCount || 5;
            let displayList = globalFoodHistory;
            if (filterText) displayList = displayList.filter(item => item.name.includes(filterText.toLowerCase()));
            if (displayList.length === 0) {
                container.innerHTML = '<span class="text-xs text-gray-400 italic pl-1">No suggestions found.</span>';
                return;
            }
            container.innerHTML = displayList.slice(0, limit).map(item => `
                <button onclick="fillFood('${item.name}')" 
                    class="inline-block px-3 py-1 bg-indigo-50 text-indigo-600 text-sm font-medium rounded-full border border-indigo-100 hover:bg-indigo-100 active:scale-95 transition mb-2 mr-2 lowercase">
                    ${item.name}
                </button>
            `).join('');
        }

        function fillFood(name) {
            document.getElementById('inputFood').value = name;
            renderSuggestions(name); 
        }

        function submitLog() {
            const food = document.getElementById('inputFood').value.trim().toLowerCase();
            const enjoyment = document.querySelector('input[name="enjoyment"]:checked')?.value || '3';
            const date = document.getElementById('inputDate').value;
            const time = document.getElementById('timeDisplay').innerText;
            
            // DETERMINE UNIT & AMOUNT
            let unit = currentUnitMode;
            let amount = '';

            if (currentUnitMode === 'score') {
                amount = document.querySelector('input[name="amountScore"]:checked')?.value || '';
            } else if (currentUnitMode === 'g') {
                amount = document.getElementById('inputAmountText')?.value || '';
                unit = 'grams/ml'; // FIXED: Map 'g' button to 'grams/ml' string for Form
            } else if (currentUnitMode === 'other') {
                // Get unit from dropdown
                unit = document.getElementById('selectOtherUnit').value;
                amount = document.getElementById('inputAmountText')?.value || '';
            }

            if (!food || !amount) return alert("Please fill in Food and Amount");

            saveToLocal(food);

            const form = document.createElement('form');
            form.action = FORM_ACTION_URL;
            form.method = 'POST';
            form.target = 'hidden_iframe';
            form.style.display = 'none';

            const addField = (name, val) => {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = name;
                input.value = val;
                form.appendChild(input);
            };

            addField(MAPPING.food, food);
            addField(MAPPING.amount, amount);
            addField(MAPPING.unit, unit);
            addField(MAPPING.enjoyment, enjoyment);
            addField(MAPPING.date, date);
            addField(MAPPING.time, time);

            document.body.appendChild(form);
            form.submit();
            
            document.getElementById('successMessage').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('successMessage').classList.add('hidden');
                document.getElementById('inputFood').value = '';
                
                // Reset amount input but keep mode? Or reset to Score? 
                // Let's reset amount input only for now
                if(document.getElementById('inputAmountText')) document.getElementById('inputAmountText').value = '';
                
                setupSmartDefaults(); 
                renderSuggestions(); 
            }, 2000);
            setTimeout(() => document.body.removeChild(form), 1000);
        }

        function setupSmartDefaults() {
            const now = new Date();
            document.getElementById('inputDate').value = now.toISOString().split('T')[0];
            
            let minutes = Math.floor(now.getMinutes() / 10) * 10;
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(minutes).padStart(2, '0');
            document.getElementById('timeDisplay').innerText = `${hh}:${mm}`;

            // Default to Score Mode
            setUnitMode("score");
        }

        function switchTab(tab) {
            const log = document.getElementById('formContainer');
            const view = document.getElementById('sheetContainer');
            const btnLog = document.getElementById('btnLog');
            const btnView = document.getElementById('btnView');
            
            const activeClass = "flex-1 py-4 font-bold text-indigo-600 border-b-4 border-indigo-600 bg-indigo-50 whitespace-nowrap";
            const inactiveClass = "flex-1 py-4 font-medium text-gray-500 hover:bg-gray-50 whitespace-nowrap";

            if (tab === 'log') {
                log.classList.remove('hidden');
                view.classList.add('hidden');
                btnLog.className = activeClass;
                btnView.className = inactiveClass;
            } else {
                log.classList.add('hidden');
                view.classList.remove('hidden');
                btnLog.className = inactiveClass;
                btnView.className = activeClass; 
                const iframe = document.getElementById('sheetFrame');
                if (iframe.src === "" || iframe.src === "about:blank") iframe.src = SHEET_VISUAL_URL;
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        select { -webkit-appearance: none; appearance: none; }
        #inputFood { text-transform: lowercase; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes slide-up {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slide-up 0.3s ease-out;
        }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col bg-white">

    <!-- SUCCESS OVERLAY -->
    <div id="successMessage" class="hidden absolute inset-0 z-50 flex items-center justify-center bg-white/90 backdrop-blur-sm pointer-events-none">
        <div class="bg-green-100 text-green-800 px-6 py-4 rounded-xl shadow-lg flex items-center transform scale-110">
            <span class="text-3xl mr-3">✅</span>
            <span class="font-bold text-lg">Saved!</span>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-900">Settings</h2>
                <button onclick="closeSettingsModal()" class="text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
            </div>
            <div class="mb-6 border-b border-gray-100 pb-6">
                <h3 class="text-xs font-bold text-gray-400 uppercase mb-3 tracking-wide">Preferences</h3>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Suggestions to show</label>
                    <input type="number" id="settingSuggestionCount" class="w-full p-3 border border-gray-300 rounded-lg focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none" min="1" max="50" onchange="updateSuggestionSetting(this.value)">
                </div>
            </div>
            
            <!-- ACTIONS -->
            <div class="space-y-4">
                <div>
                    <h3 class="text-xs font-bold text-gray-400 uppercase mb-2 tracking-wide">Data Source</h3>
                    <p class="text-xs text-gray-500 mb-2">To delete rows, open the sheet directly.</p>
                    <button onclick="openGoogleSheet()" class="w-full py-3 bg-blue-50 text-blue-700 font-bold rounded-lg hover:bg-blue-100 border border-blue-200 transition flex items-center justify-center space-x-2">
                        <span>📄</span> <span>Open Google Sheet</span>
                    </button>
                </div>
                <div>
                    <h3 class="text-xs font-bold text-gray-400 uppercase mb-2 tracking-wide">Troubleshooting</h3>
                    <button onclick="resetCache()" class="w-full py-3 bg-red-50 text-red-700 font-bold rounded-lg hover:bg-red-100 border border-red-200 transition flex items-center justify-center space-x-2">
                        <span>🔄</span> <span>Reset Local Cache</span>
                    </button>
                </div>
                <div class="border-t border-gray-100 pt-4">
                    <h3 class="text-xs font-bold text-gray-400 uppercase mb-2 tracking-wide">Manual Import</h3>
                    <textarea id="importText" class="w-full h-20 p-3 border border-gray-300 rounded-lg text-sm mb-2 focus:border-indigo-500 outline-none" placeholder="Paste food list..."></textarea>
                    <button onclick="runImport()" class="w-full py-2 bg-gray-800 text-white font-semibold rounded-lg hover:bg-gray-900 transition">Import</button>
                </div>
            </div>
        </div>
    </div>

    <!-- TIME PICKER MODAL -->
    <div id="timeModal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-end sm:items-center justify-center sm:p-4">
        <div class="bg-white w-full sm:max-w-sm rounded-t-2xl sm:rounded-2xl shadow-2xl max-h-[80vh] flex flex-col animate-slide-up">
            <div class="flex justify-between items-center p-4 border-b border-gray-100 bg-white rounded-t-2xl z-10">
                <button onclick="closeTimeModal()" class="text-gray-500 font-medium p-2">Cancel</button>
                <span class="font-bold text-gray-900">Select Time</span>
                <button onclick="saveTimeModal()" class="text-indigo-600 font-bold p-2">Done</button>
            </div>
            <div class="flex-1 flex overflow-hidden relative h-64">
                <div class="w-1/2 flex flex-col items-center overflow-y-auto no-scrollbar py-20" id="pickerHours"></div>
                <div class="w-[1px] bg-gray-200 my-4"></div>
                <div class="w-1/2 flex flex-col items-center overflow-y-auto no-scrollbar py-20" id="pickerMinutes"></div>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <nav class="flex bg-white shadow-sm border-b border-gray-200 z-10 h-[60px] relative">
        <button id="btnLog" onclick="switchTab('log')" class="flex-1 py-4 font-bold text-indigo-600 border-b-4 border-indigo-600 bg-indigo-50 whitespace-nowrap">
            📝 Log Meal
        </button>
        <button id="btnView" onclick="switchTab('view')" class="flex-1 py-4 font-medium text-gray-500 hover:bg-gray-50 whitespace-nowrap">
            📊 History
        </button>
        <div class="absolute top-0 right-0 h-full flex items-center pr-4 space-x-3">
            <div class="flex items-center space-x-1">
                <div id="statusDot" class="w-2 h-2 rounded-full bg-gray-300"></div>
                <span id="statusLabel" class="text-[10px] text-gray-400 uppercase font-bold hidden sm:block">Load</span>
            </div>
            <button onclick="openSettingsModal()" class="text-gray-400 hover:text-indigo-600 p-1">
                ⚙️
            </button>
        </div>
    </nav>

    <!-- CONTENT -->
    <div class="flex-1 relative bg-gray-100 overflow-hidden">
        <div id="formContainer" class="w-full h-full overflow-y-auto p-4 pb-20">
            <div class="max-w-lg mx-auto bg-white rounded-xl shadow-sm p-6 space-y-6">
                
                <!-- Date & Time -->
                <div class="flex space-x-4">
                    <div class="w-1/2">
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Date</label>
                        <input type="date" id="inputDate" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg font-semibold text-gray-700">
                    </div>
                    <div class="w-1/2">
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Time</label>
                        <div onclick="openTimeModal()" 
                             class="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg font-semibold text-gray-700 text-center cursor-pointer hover:bg-gray-100 active:bg-gray-200 transition"
                             id="timeDisplay">12:00</div>
                    </div>
                </div>

                <!-- Suggestions -->
                <div class="bg-indigo-50/50 p-3 rounded-lg border border-indigo-100">
                    <p class="text-xs font-bold text-indigo-400 uppercase mb-2">Least Recently Eaten</p>
                    <div id="suggestionChips" class="flex flex-wrap"></div>
                </div>

                <!-- Food -->
                <div>
                    <label class="block text-sm font-bold text-gray-800 mb-1">Food Item</label>
                    <input type="text" id="inputFood" placeholder="e.g. avocado" class="w-full p-4 border border-gray-300 rounded-xl text-lg focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none">
                </div>

                <!-- QUICK UNIT TOGGLE -->
                <div>
                    <label class="block text-sm font-bold text-gray-800 mb-2">Amount Consumed</label>
                    
                    <!-- Toggle Bar -->
                    <div class="bg-gray-100 p-1 rounded-xl flex space-x-1 mb-4">
                        <button onclick="setUnitMode('score')" id="btn-mode-score" class="flex-1 py-3 rounded-lg text-sm font-bold shadow bg-white text-indigo-600 transition transform scale-105">⭐ Score</button>
                        <button onclick="setUnitMode('g')" id="btn-mode-g" class="flex-1 py-3 rounded-lg text-sm font-medium text-gray-500 hover:bg-white hover:shadow-sm transition">⚖️ Grams</button>
                        <button onclick="setUnitMode('other')" id="btn-mode-other" class="flex-1 py-3 rounded-lg text-sm font-medium text-gray-500 hover:bg-white hover:shadow-sm transition">⋯ Other</button>
                    </div>

                    <!-- Hidden Dropdown for 'Other' -->
                    <div id="otherUnitContainer" class="hidden mb-4 animate-slide-down">
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Specific Unit</label>
                        <select id="selectOtherUnit" class="w-full p-3 bg-white border border-gray-300 rounded-lg text-gray-700 font-medium">
                            <option value="teaspoon">Teaspoons</option>
                            <option value="spoon">Spoon</option>
                            <option value="cup">Cup</option>
                            <option value="pieces">Pieces</option>
                            <option value="ml">ml</option>
                            <option value="oz">oz</option>
                        </select>
                    </div>

                    <!-- Input Area (Dynamic) -->
                    <div id="amountContainer"></div>
                </div>

                <!-- Enjoyment -->
                <div>
                    <label class="block text-sm font-bold text-gray-800 mb-2">Enjoyment</label>
                    <div class="flex justify-between gap-1">
                        <label class="flex flex-col items-center cursor-pointer flex-1"><input type="radio" name="enjoyment" value="0" class="sr-only peer"><div class="w-full py-2 rounded-lg border border-transparent hover:bg-red-50 peer-checked:bg-red-100 peer-checked:border-red-300 transition text-center text-2xl">🤮</div></label>
                        <label class="flex flex-col items-center cursor-pointer flex-1"><input type="radio" name="enjoyment" value="1" class="sr-only peer"><div class="w-full py-2 rounded-lg border border-transparent hover:bg-orange-50 peer-checked:bg-orange-100 peer-checked:border-orange-300 transition text-center text-2xl">😞</div></label>
                        <label class="flex flex-col items-center cursor-pointer flex-1"><input type="radio" name="enjoyment" value="2" class="sr-only peer"><div class="w-full py-2 rounded-lg border border-transparent hover:bg-yellow-50 peer-checked:bg-yellow-100 peer-checked:border-yellow-300 transition text-center text-2xl">😐</div></label>
                        <label class="flex flex-col items-center cursor-pointer flex-1"><input type="radio" name="enjoyment" value="3" checked class="sr-only peer"><div class="w-full py-2 rounded-lg border border-transparent hover:bg-green-50 peer-checked:bg-green-100 peer-checked:border-green-300 transition text-center text-2xl">🙂</div></label>
                        <label class="flex flex-col items-center cursor-pointer flex-1"><input type="radio" name="enjoyment" value="4" class="sr-only peer"><div class="w-full py-2 rounded-lg border border-transparent hover:bg-green-50 peer-checked:bg-green-100 peer-checked:border-green-300 transition text-center text-2xl">😋</div></label>
                        <label class="flex flex-col items-center cursor-pointer flex-1"><input type="radio" name="enjoyment" value="5" class="sr-only peer"><div class="w-full py-2 rounded-lg border border-transparent hover:bg-indigo-50 peer-checked:bg-indigo-100 peer-checked:border-indigo-300 transition text-center text-2xl">🥳</div></label>
                    </div>
                </div>
                <button onclick="submitLog()" class="w-full py-4 bg-indigo-600 text-white text-xl font-bold rounded-xl shadow-lg hover:bg-indigo-700 active:scale-95 transition transform">Save Entry</button>
            </div>
        </div>
        <div id="sheetContainer" class="w-full h-full hidden"><iframe id="sheetFrame" class="w-full h-full border-none bg-white"></iframe></div>
    </div>
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
</body>
</html>
